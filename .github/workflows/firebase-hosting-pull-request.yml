name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Previews of pull requests into main look like the public site: no portal link, placeholder pages hidden.
      - run: npm ci && npm run build
        env:
          VITE_REGISTRATION_OPEN: ${{ github.base_ref == 'main' && 'false' || 'true' }}
          VITE_SHOW_PLACEHOLDER_PAGES: ${{ github.base_ref == 'main' && 'false' || 'true' }}
          VITE_PUBLIC_SITE_URL: ${{ github.base_ref == 'main' && 'https://iol2027.web.app' || 'https://iol2027-dev.web.app' }}
          VITE_PORTAL_URL: ${{ github.base_ref == 'main' && 'https://iol2027-portal.web.app' || 'https://iol2027-portal-dev.web.app' }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IOL2027 }}
          projectId: iol2027
          target: prod
