# Stable preview URL for the development branch.
# Every push to development refreshes the "development" Firebase Hosting channel,
# which keeps the same URL. Expiry is reset to 30 days on each deploy.
name: Deploy development preview to Firebase Hosting
on:
  push:
    branches:
      - development
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IOL2027 }}
          projectId: iol2027
          channelId: development
          expires: 30d
