# Permanent development site: https://iol2027-dev.web.app
# Every push to the development branch deploys to the "dev" hosting target
# (site iol2027-dev). It never touches the public site, which deploys from main.
# The dev site sends X-Robots-Tag: noindex so search engines do not list it.
name: Deploy development to iol2027-dev
on:
  push:
    branches:
      - development
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IOL2027 }}
          projectId: iol2027
          channelId: live
          target: dev
