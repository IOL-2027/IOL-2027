# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Since 9 Nov 2026 the public site shows everything, because the IOL committee asked to review the whole site.
      # Its /portal runs on the test system (the test API and database, reset before launch), so it shows the
      # test-environment note. To hide registration or the placeholder pages again, add
      # VITE_REGISTRATION_OPEN: 'false' or VITE_SHOW_PLACEHOLDER_PAGES: 'false' here (src/launch.ts).
      - run: npm ci && npm run build
        env:
          VITE_TEST_ENVIRONMENT: 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IOL2027 }}
          channelId: live
          projectId: iol2027
          target: prod
