# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Until launch the public site shows no link to the registration portal (registration opens 18 January 2027)
      # and hides the placeholder pages (Gallery, People, Sponsors) (src/launch.ts). Delete VITE_REGISTRATION_OPEN or
      # VITE_SHOW_PLACEHOLDER_PAGES when that part goes live. The portal itself deploys from development until launch.
      - run: npm ci && npm run build
        env:
          VITE_REGISTRATION_OPEN: 'false'
          VITE_SHOW_PLACEHOLDER_PAGES: 'false'
          VITE_PUBLIC_SITE_URL: https://iol2027.web.app
          VITE_PORTAL_URL: https://iol2027-portal.web.app
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IOL2027 }}
          channelId: live
          projectId: iol2027
          target: prod
