# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Until launch the public site hides registration (opens 18 January 2027) and the placeholder pages:
      # Gallery, People, Sponsors (src/launch.ts). Delete each line when its part goes live.
      - run: npm ci && npm run build
        env:
          VITE_REGISTRATION_OPEN: 'false'
          VITE_SHOW_PLACEHOLDER_PAGES: 'false'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IOL2027 }}
          channelId: live
          projectId: iol2027
          target: prod
