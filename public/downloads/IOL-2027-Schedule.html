<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IOL 2027 Tentative Schedule</title>
  <style>
    :root{--ink:#160c1b;--night:#1d0929;--cream:#f3eee4;--orange:#eda363;--jade:#719a79;--plum:#681f7a;--red:#c0564b}
    *{box-sizing:border-box}
    html,body{margin:0;background:#f3eee4;font-family:Arial,sans-serif;color:var(--ink)}
    body{width:max-content}
    table{width:1320px;border-collapse:separate;border-spacing:0;background:#fff;overflow:hidden}
    caption{padding:24px 28px;text-align:left;background:var(--cream);color:var(--night);font-family:Georgia,serif;font-size:28px;font-weight:700}
    caption span{display:block;margin-top:5px;font:600 13px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--plum)}
    th,td{border-right:1px solid rgba(22,12,27,.13);border-bottom:1px solid rgba(22,12,27,.13)}
    thead th{height:62px;padding:10px;background:var(--night);color:var(--cream);text-align:center;font-size:17px}
    thead th:first-child{width:116px;text-align:left;padding-left:17px}
    thead small{display:block;margin-top:4px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(243,238,228,.65)}
    tbody tr{height:47px}
    tbody th{padding:8px 14px;background:#f8f4ed;text-align:left;white-space:nowrap;font-size:12px;color:#615762}
    tbody td{width:150px;padding:8px 10px;text-align:center;vertical-align:middle;font-size:13px;line-height:1.25;font-weight:600;white-space:pre-line}
    .plain{background:#fff;color:#777}.kaset{background:#cee5cf;color:#173a27}.chula{background:#eed3df;color:#4e1f35}.hotel{background:#d8d3e3;color:#28213d}.other{background:#f1d19c;color:#4b2b0f}
    tfoot td{padding:16px 18px;background:var(--cream);border:0;font-size:12px;color:#5b515d}
    .legend{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:7px}.swatch{width:14px;height:14px;border:1px solid rgba(22,12,27,.18);border-radius:3px}
    @media print{table{width:100%}caption{padding-top:0}thead{-webkit-print-color-adjust:exact;print-color-adjust:exact}td,th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>
</head>
<body>
  <table id="schedule" aria-label="Tentative IOL 2027 schedule from 21 to 28 July 2027"></table>
  <script>
    const DAYS=[[21,'Wed'],[22,'Thu'],[23,'Fri'],[24,'Sat'],[25,'Sun'],[26,'Mon'],[27,'Tue'],[28,'Wed']]
    const SCHEDULE=[
      [[12,'Arrival','hotel'],[3,'Light Dinner\n& Rehearsal','hotel']],
      [[2,'Breakfast (in transit)','hotel'],[1,'','plain'],[2,'Opening Ceremony','kaset'],[2,'Lunch','kaset'],[1,'Kick-off Session','kaset'],[1,'Activity I','kaset'],[1,'In Transit','kaset'],[2,'','plain'],[3,'Welcome Dinner','hotel']],
      [[2,'Breakfast','hotel'],[1,'','plain'],[6,'Individual Contest','chula'],[3,'','plain'],[2,'Dinner','hotel'],[1,'Activity II','hotel']],
      [[2,'Breakfast','hotel'],[9,'Excursion','other'],[1,'','plain'],[2,'Dinner','other'],[1,'','plain']],
      [[2,'Breakfast','hotel'],[9,'City Tour','other'],[1,'','plain'],[2,'Dinner','hotel'],[1,'','plain']],
      [[2,'Breakfast','hotel'],[1,'','plain'],[4,'Team Contest','chula'],[1,'Lunch','chula'],[2,'Activity III','chula'],[2,'','plain'],[2,'Dinner','hotel'],[1,'Jeopardy','hotel']],
      [[2,'Breakfast','hotel'],[1,'','plain'],[4,'Solution Presentation','chula'],[1,'Lunch','chula'],[2,'Closing Ceremony','chula'],[2,'','plain'],[3,'Cultural Night','chula']],
      [[2,'Breakfast','hotel'],[10,'Departure','hotel'],[3,'','plain']]
    ]
    const grid=Array.from({length:15},()=>Array(8).fill(null))
    SCHEDULE.forEach((segments,day)=>{let row=0;segments.forEach(([span,text,category])=>{grid[row][day]={span,text,category};for(let i=1;i<span;i++)grid[row+i][day]=false;row+=span})})
    const table=document.getElementById('schedule')
    const caption=document.createElement('caption')
    caption.innerHTML='IOL 2027 Tentative Schedule<span>21-28 July 2027 · Bangkok, Thailand</span>'
    table.append(caption)
    const thead=document.createElement('thead')
    thead.innerHTML=`<tr><th>Time</th>${DAYS.map(([date,day])=>`<th>${date} July<small>${day}</small></th>`).join('')}</tr>`
    table.append(thead)
    const tbody=document.createElement('tbody')
    grid.forEach((cells,row)=>{const tr=document.createElement('tr');tr.innerHTML=`<th>${String(6+row).padStart(2,'0')}:00 - ${String(7+row).padStart(2,'0')}:00</th>`;cells.forEach(cell=>{if(cell){const td=document.createElement('td');td.rowSpan=cell.span;td.className=cell.category;td.textContent=cell.text;tr.append(td)}});tbody.append(tr)})
    table.append(tbody)
    const tfoot=document.createElement('tfoot')
    tfoot.innerHTML='<tr><td colspan="9"><div class="legend"><strong>VENUES</strong><span><i class="swatch kaset"></i>Kasetsart University</span><span><i class="swatch chula"></i>Chulalongkorn University</span><span><i class="swatch hotel"></i>Mandarin Hotel</span><span><i class="swatch other"></i>Other locations</span><span>Schedule subject to confirmation.</span></div></td></tr>'
    table.append(tfoot)
  </script>
</body>
</html>
